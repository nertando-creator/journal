<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал сетапов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="market.css">
</head>
<body>

<!-- ===== ВХОД ===== -->
<section id="login" hidden>
  <form id="login-form" class="login-card">
    <h1>Вход</h1>
    <label>Почта<input id="login-email" type="email" required autocomplete="username"></label>
    <label>Пароль<input id="login-pass" type="password" required autocomplete="current-password"></label>
    <button type="submit" id="login-btn" class="btn">Войти</button>
    <p id="login-error" class="login-error"></p>
  </form>
</section>

<!-- ===== ВЕРХНЯЯ ПАНЕЛЬ (показывается вместе с #app; market.js синхронизирует hidden) ===== -->
<header id="topnav" class="topnav" hidden>
  <span class="topnav-side"></span>
  <nav class="topnav-center" aria-label="Окна">
    <button type="button" id="mm-tab-gallery" class="topnav-item active">Формации</button>
    <i class="topnav-divider" aria-hidden="true"></i>
    <button type="button" id="mm-tab-market" class="topnav-item">График</button>
  </nav>
  <span class="topnav-side topnav-right">
    <button type="button" id="topnav-gear" class="topnav-gear" title="Настройки (скоро)" aria-label="Настройки (скоро)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </span>
</header>

<!-- ===== ГЛАВНОЕ ОКНО ===== -->
<main id="app" class="page" hidden>
  <div id="view-gallery">
    <div class="search"></div>
    <div class="tabs-row">
      <div id="tabs" class="tabs"></div>
      <span id="upload-status" class="upload-status"></span>
    </div>
    <section class="panel"><div id="grid" class="grid"></div></section>
  </div>
  <section id="mm-view" class="mod-market-view" hidden></section>
</main>

<!-- ===== МОДАЛКА ===== -->
<div id="modal" class="overlay" hidden>
  <button id="nav-prev" class="nav nav-prev" aria-label="Назад">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <button id="nav-next" class="nav nav-next" aria-label="Вперёд">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <div id="modal-box" class="modal">
    <div class="m-left">
      <div class="m-frame">
        <div class="m-main">
        <div id="m-empty" class="m-empty" hidden><span id="m-empty-text"></span></div>
        <div id="m-imgbox" class="m-imgbox">
        <img id="m-img-prev" alt="" draggable="false">
        <img id="m-img" alt="" draggable="false">
        <button id="m-trash" class="trash" title="Удалить навсегда">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>
        </button>
        <button id="m-extra-del" class="trash extra-del" title="Удалить запасную картинку" hidden>
          <svg viewBox="0 0 10 10" width="12" height="12"><path d="M1 1l8 8M9 1l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        </div>
        </div>
        <div id="m-side" class="m-side"></div>
      </div>
    </div>
    <div class="m-right">
      <div class="m-title-row">
        <input id="m-title" class="m-title" type="text" maxlength="200" placeholder="Название" autocomplete="off">
        <button id="m-star" class="star" title="Избранное">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
        </button>
      </div>
      <div id="tags-host" class="tags-host menu-host">
        <div id="tags-field" class="tags-field scrolly"></div>
        <span class="tri"><svg viewBox="0 0 10 6" width="8" height="5"><path d="M0 0h10L5 6z" fill="currentColor"/></svg></span>
      </div>
      <div class="m-selects">
        <div class="m-sel-cell">
          <div class="m-label">Результат</div>
          <div id="status-host" class="menu-host">
            <button type="button" id="status-select" class="select"><span class="sel-val"></span><span class="tri"><svg viewBox="0 0 10 6" width="8" height="5"><path d="M0 0h10L5 6z" fill="currentColor"/></svg></span></button>
          </div>
        </div>
        <div class="m-sel-cell">
          <div class="m-label">Папка</div>
          <div id="folder-host" class="menu-host">
            <button type="button" id="folder-select" class="select"><span class="sel-val"></span><span class="tri"><svg viewBox="0 0 10 6" width="8" height="5"><path d="M0 0h10L5 6z" fill="currentColor"/></svg></span></button>
          </div>
        </div>
      </div>
      <div id="m-meta" class="m-meta" hidden>
        <div class="m-meta-row m-meta-tf">
          <div class="m-sel-cell">
            <div class="m-label">ТФ</div>
            <div id="tf-host" class="menu-host">
              <button type="button" id="tf-select" class="select"><span class="sel-val"></span><span class="tri"><svg viewBox="0 0 10 6" width="8" height="5"><path d="M0 0h10L5 6z" fill="currentColor"/></svg></span></button>
            </div>
          </div>
          <div id="m-coin" class="m-coin"></div>
        </div>
        <div id="m-build-wrap" class="m-build" hidden>
          <div class="m-range-row">
            <button type="button" id="m-build" class="m-cal-btn" title="Выбрать день и сделать скрин" aria-label="Календарь: выбрать день для скрина" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            </button>
            <div id="m-range" class="m-range empty">Даты нет</div>
            <input id="m-cal" class="m-cal-input" type="date" tabindex="-1" aria-hidden="true">
          </div>
          <div id="m-build-status" class="m-build-status"></div>
        </div>
      </div>
      <div class="m-comment">
        <div class="m-label m-label-row"><span>Комментарий</span><span id="comment-state" class="save-state"></span></div>
        <textarea id="m-comment" class="m-comment-text scrolly" autocomplete="off"></textarea>
      </div>
    </div>
  </div>
</div>

<!-- ===== РАЗВЁРНУТЫЙ ВИД ===== -->
<div id="zoom" class="overlay zoom-overlay" hidden>
  <div id="zoom-box" class="zoom-box">
    <img id="z-prev" alt="" draggable="false">
    <img id="z-img" alt="" draggable="false">
  </div>
</div>

<!-- ===== ДИАЛОГ (подтверждения, дубли) ===== -->
<div id="dialog" class="overlay dialog-overlay" hidden>
  <div class="dialog">
    <h2 id="dialog-title"></h2>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-btns" class="dialog-btns"></div>
  </div>
</div>

<!-- ===== ЛОГИ ===== -->
<div class="bottom-bar">
  <span id="usage" class="stats usage"></span>
  <span id="stats" class="stats"></span>
  <button id="logs-toggle" class="logs-toggle">Логи</button>
</div>
<aside id="logs" class="logs" hidden>
  <header>
    <span id="logs-title"></span>
    <span class="logs-actions">
      <button id="logs-all" class="btn small active">Все</button>
      <button id="logs-err" class="btn small">Ошибки</button>
      <button id="logs-clear" class="btn small">Очистить</button>
      <button id="logs-copy" class="btn small">Скопировать всё</button>
      <button id="logs-close" class="btn small" aria-label="Закрыть">×</button>
    </span>
  </header>
  <div id="logs-body" class="logs-body"></div>
</aside>

<div id="toasts" class="toasts"></div>
<div id="net-banner" class="net-banner" hidden>Нет соединения</div>

<!-- Supabase с закреплённой версией -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
<script src="market.js"></script>
</body>
</html>
